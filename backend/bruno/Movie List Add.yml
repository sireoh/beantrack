info:
  name: Movie List Add
  type: http
  seq: 11

http:
  method: POST
  url: "{{uri}}/api/movielist/add"
  headers:
    - name: Cookie
      value: beantrack_session={{cookie_value}}
  body:
    type: json
    data: |-
      {
        "movie": {
          "imdb": "tt0133093",
          "title": "The Notebook",
          "image": "https://m.media-amazon.com/images/M/MV5BZjE0ZjgzMzYtMTAxYi00NGMzLThmZDktNzFlMzA2MWRmYWQ0XkEyXkFqcGc@._V1_QL75_UX380_CR0,4,380,562_.jpg"
        },
        "status": "planned"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
