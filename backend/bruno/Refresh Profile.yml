info:
  name: Refresh Profile
  type: http
  seq: 12

http:
  method: GET
  url: "{{uri}}/api/auth/login"
  headers:
    - name: Cookie
      value: beantrack_session={{cookie_value}}

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
