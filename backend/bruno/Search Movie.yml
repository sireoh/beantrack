info:
  name: Search Movie
  type: http
  seq: 7

http:
  method: GET
  url: "{{uri}}/api/search?type=movie&q=the notebook"
  headers:
    - name: Cookie
      value: beantrack_session={{cookie_value}}
  params:
    - name: type
      value: movie
      type: query
    - name: q
      value: the notebook
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
