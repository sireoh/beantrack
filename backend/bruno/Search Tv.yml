info:
  name: Search Tv
  type: http
  seq: 6

http:
  method: GET
  url: "{{uri}}/api/search?type=tv&q=ted lasso"
  headers:
    - name: Cookie
      value: beantrack_session={{cookie_value}}
  params:
    - name: type
      value: tv
      type: query
    - name: q
      value: ted lasso
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
