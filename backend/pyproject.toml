[project]
name = "beantrack-backend"
version = "0.1.0"
description = "BeanTrack API: a TV show and movie tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["testing"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "testing", "migrations"]
