<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>BeanTrack</title>
		<script>
			// Apply the theme before first paint to avoid a flash of the wrong theme.
			// Cached choice (localStorage; also the logged-in account's theme from last visit)
			// > system preference (prefers-color-scheme) > PUBLIC_DAISYUI_THEME > "dark".
			// Once logged in, the theme saved on the account is applied (stores/user.ts).
			(function () {
				var fallback = '%sveltekit.env.PUBLIC_DAISYUI_THEME%';
				if (!fallback || fallback.charAt(0) === '%') fallback = 'dark';
				var saved = null;
				try {
					saved = localStorage.getItem('beantrack.theme');
				} catch (e) {}
				var system = null;
				if (window.matchMedia) {
					if (window.matchMedia('(prefers-color-scheme: dark)').matches) system = 'dark';
					else if (window.matchMedia('(prefers-color-scheme: light)').matches) system = 'light';
				}
				document.documentElement.setAttribute('data-theme', saved || system || fallback);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
